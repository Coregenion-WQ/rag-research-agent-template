# Runs the RAG API with a persistent Qdrant vector store.
#
#   cp .env.example .env   # add your model API keys
#   docker compose up -d --build
#
# The API is then available at http://localhost:8000 (docs at /docs).
# Ports are bound to localhost only; set RAG_API_KEY before exposing them.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q 'ready' <&3"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    image: rag-research-agent:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      RAG_API_KEY: ${RAG_API_KEY:-}
      RAG_RETRIEVER_PROVIDER: ${RAG_RETRIEVER_PROVIDER:-qdrant}
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_data:
